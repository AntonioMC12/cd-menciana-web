name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Keep an in-flight deployment and queue the newest publication behind it.
concurrency:
  group: public-site-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build and upload site
        uses: withastro/action@v5
        env:
          PUBLIC_CMS_API_URL: https://cms.cdmenciana.es
          PUBLIC_SITE_URL: https://cdmenciana.es
          PUBLIC_SITE_BASE: /
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
